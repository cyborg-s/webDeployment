name: Build & Deploy to AWS VM

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build portfolio (Angular)
        working-directory: portfolio/public
        run: |
          npm ci
          npx ng build --configuration production
          docker build -t webdeploy_portfolio ../..
          mkdir -p ../../docker-images
          docker save webdeploy_portfolio | gzip > ../../docker-images/webdeploy_portfolio.tar.gz

      - name: Build pokedex (NGINX)
        run: |
          docker build -t webdeploy_pokedex ./pokedex
          mkdir -p docker-images
          docker save webdeploy_pokedex | gzip > docker-images/webdeploy_pokedex.tar.gz

      - name: Build sharky (NGINX)
        run: |
          docker build -t webdeploy_sharky ./sharky
          mkdir -p docker-images
          docker save webdeploy_sharky | gzip > docker-images/webdeploy_sharky.tar.gz

      - name: Build join (NGINX)
        run: |
          docker build -t webdeploy_join ./join
          mkdir -p docker-images
          docker save webdeploy_join | gzip > docker-images/webdeploy_join.tar.gz

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.AWS_VM_SSH_KEY }}

      - name: Add VM to known_hosts
        run: echo "${{ secrets.AWS_VM_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      - name: Upload Docker images to VM via rsync
        run: |
          rsync -avz --progress --partial docker-images/ ubuntu@${{ secrets.AWS_VM_IP }}:/home/ubuntu/webDeployment/docker-images/

      - name: Deploy on VM
        run: |
          ssh ubuntu@${{ secrets.AWS_VM_IP }} "
            cd /home/ubuntu/webDeployment &&
            for img in docker-images/*.tar.gz; do
              gunzip -c \$img | docker load
            done &&
            docker-compose up -d
          "