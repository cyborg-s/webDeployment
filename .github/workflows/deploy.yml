name: Deploy to AWS VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.8
        with:
          ssh-private-key: ${{ secrets.AWS_VM_SSH_KEY }}

      - name: Copy repo to VM
        run: |
          rsync -avz --exclude '.git' ./ ubuntu@${{ secrets.AWS_VM_IP }}:/home/ubuntu/webDeployment/

      - name: Build & deploy on VM
        run: |
          ssh ubuntu@${{ secrets.AWS_VM_IP }} "
          cd /home/ubuntu/webDeployment &&
          docker compose pull &&
          docker compose up -d --build
          "