name: Deploy to AWS VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # =====================
      # Build Angular projects locally in GitHub Actions
      # =====================
      - name: Build Portfolio Angular App
        working-directory: ./portfolio
        run: |
          npm ci
          npm run build -- --configuration production

      - name: Build Pokedex Angular App
        working-directory: ./pokedex
        run: |
          npm ci
          npm run build -- --configuration production

      # Hier ggf. weitere Angular/Frontend-Projekte

      # =====================
      # Build Docker images locally in GitHub Actions
      # =====================

      - name: Install Angular CLI
        run: npm install -g @angular/cli

      - name: Build Docker images
        run: |
          docker build -t webdeploy_portfolio ./portfolio
          docker build -t webdeploy_pokedex ./pokedex
          docker build -t webdeploy_sharky ./sharky
          docker build -t webdeploy_join ./join
          docker build -t webdeploy_contact-api ./contact-api

      # =====================
      # Push Docker images to VM
      # =====================
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.AWS_VM_SSH_KEY }}

      - name: Add VM to known_hosts
        run: echo "${{ secrets.AWS_VM_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      - name: Transfer Docker images to VM
        run: |
          docker save webdeploy_portfolio | bzip2 | ssh ubuntu@${{ secrets.AWS_VM_IP }} "bunzip2 | docker load"
          docker save webdeploy_pokedex | bzip2 | ssh ubuntu@${{ secrets.AWS_VM_IP }} "bunzip2 | docker load"
          docker save webdeploy_sharky | bzip2 | ssh ubuntu@${{ secrets.AWS_VM_IP }} "bunzip2 | docker load"
          docker save webdeploy_join | bzip2 | ssh ubuntu@${{ secrets.AWS_VM_IP }} "bunzip2 | docker load"
          docker save webdeploy_contact-api | bzip2 | ssh ubuntu@${{ secrets.AWS_VM_IP }} "bunzip2 | docker load"

      # =====================
      # Deploy containers via docker-compose on VM
      # =====================
      - name: Deploy with docker-compose on VM
        run: |
          ssh ubuntu@${{ secrets.AWS_VM_IP }} "
            cd /home/ubuntu/webDeployment &&
            docker-compose up -d
          "