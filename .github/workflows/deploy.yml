name: Build Docker Images

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v3

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # Portfolio
      - name: Build portfolio
        run: |
          cd portfolio/public
          npm ci
          npx ng build --configuration production
          cd ../..
          docker build -t ghcr.io/${{ github.repository_owner }}/portfolio:latest ./portfolio
          docker push ghcr.io/${{ github.repository_owner }}/portfolio:latest

      # Pokedex
      - name: Build pokedex
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/pokedex:latest ./pokedex
          docker push ghcr.io/${{ github.repository_owner }}/pokedex:latest

      # Sharky
      - name: Build sharky
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/sharky:latest ./sharky
          docker push ghcr.io/${{ github.repository_owner }}/sharky:latest

      # Join
      - name: Build join
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/join:latest ./join
          docker push ghcr.io/${{ github.repository_owner }}/join:latest