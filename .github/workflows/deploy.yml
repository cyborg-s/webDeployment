name: CI checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: portfolio/public
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portfolio/public/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test contact worker
        run: node --test worker/index.test.mjs

      - name: Build production portfolio
        run: npm run build -- --configuration production

      - name: Validate portfolio Worker and assets
        run: npx --no-install wrangler deploy --dry-run

  join:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: join
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: join/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Join assets
        run: npx --no-install wrangler deploy --dry-run
