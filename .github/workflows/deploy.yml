name: Build & Deploy to AWS VM

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      # ---- Angular Build ----
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Build portfolio (Angular)
        working-directory: portfolio/public
        run: |
          npm ci
          npx ng build --configuration production

      # ---- Docker Setup ----
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # ---- Build Docker images ----
      - name: Build portfolio Docker image
        run: |
          docker build -t webdeploy_portfolio ./portfolio \
            --build-arg DIST_DIR=public/dist/portfolio

      - name: Build pokedex Docker image
        run: |
          docker build -t webdeploy_pokedex ./pokedex

      - name: Build sharky Docker image
        run: |
          docker build -t webdeploy_sharky ./sharky

      - name: Build join Docker image
        run: |
          docker build -t webdeploy_join ./join

      # ---- Save images locally for transfer ----
      - name: Save Docker images as tar
        run: |
          mkdir -p docker-images
          docker save webdeploy_portfolio -o docker-images/webdeploy_portfolio.tar
          docker save webdeploy_pokedex -o docker-images/webdeploy_pokedex.tar
          docker save webdeploy_sharky -o docker-images/webdeploy_sharky.tar
          docker save webdeploy_join -o docker-images/webdeploy_join.tar

      # ---- Deploy to VM ----
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.AWS_VM_SSH_KEY }}

      - name: Add VM to known_hosts
        run: echo "${{ secrets.AWS_VM_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      - name: Copy Docker images to VM
        run: |
          scp -r docker-images ubuntu@${{ secrets.AWS_VM_IP }}:/home/ubuntu/webDeployment/

      - name: Load & Deploy on VM
        run: |
          ssh ubuntu@${{ secrets.AWS_VM_IP }} "
            cd /home/ubuntu/webDeployment &&
            for img in docker-images/*.tar; do docker load -i \$img; done &&
            docker-compose up -d
          "