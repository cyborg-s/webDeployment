name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v3

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # Portfolio (Angular)
      - name: Build portfolio
        run: |
          cd portfolio/public
          npm ci
          npx ng build --configuration production
          cd ../..
          docker build -t ghcr.io/${{ github.repository_owner }}/portfolio ./portfolio
          docker push ghcr.io/${{ github.repository_owner }}/portfolio

      # Pokedex
      - name: Build pokedex
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/pokedex ./pokedex
          docker push ghcr.io/${{ github.repository_owner }}/pokedex

      # Sharky
      - name: Build sharky
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/sharky ./sharky
          docker push ghcr.io/${{ github.repository_owner }}/sharky

      # Join
      - name: Build join
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/join ./join
          docker push ghcr.io/${{ github.repository_owner }}/join


      - name: Deploy to VM
        run: |
          ssh ubuntu@${{ secrets.AWS_VM_IP }} "
            cd /home/ubuntu/webDeployment &&
            docker compose pull &&
            docker compose up -d
          "