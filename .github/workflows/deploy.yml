name: Build & Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  build-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # ---------------- Portfolio (Angular) ----------------
      - name: Build portfolio Angular app
        working-directory: portfolio/public
        run: |
          npm ci
          npx ng build --configuration production

      - name: Build Docker images
        run: |
          mkdir -p docker-images
          docker build -t portfolio ./portfolio
          docker save portfolio | gzip > docker-images/portfolio.tar.gz

          docker build -t pokedex ./pokedex
          docker save pokedex | gzip > docker-images/pokedex.tar.gz

          docker build -t sharky ./sharky
          docker save sharky | gzip > docker-images/sharky.tar.gz

          docker build -t join ./join
          docker save join | gzip > docker-images/join.tar.gz

          docker build -t proxy ./proxy
          docker save proxy | gzip > docker-images/proxy.tar.gz

          docker build -t contact-api ./contact-api
          docker save contact-api | gzip > docker-images/contact-api.tar.gz

      - name: Upload Docker images as artifacts
        uses: actions/upload-artifact@v3
        with:
          name: docker-images
          path: docker-images/