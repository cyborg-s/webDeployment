name: Build & Deploy to AWS VM

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [portfolio, pokedex, sharky, join]  # alle Angular-Projekte

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies & build Angular project
        working-directory: ${{ matrix.project }}/public
        run: |
          npm ci
          npx ng build --configuration production

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        run: |
          docker build -t webdeploy_${{ matrix.project }} ./${{ matrix.project }}

      - name: Save Docker image as tar
        run: |
          mkdir -p docker-images
          docker save webdeploy_${{ matrix.project }} -o docker-images/webdeploy_${{ matrix.project }}.tar

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.AWS_VM_SSH_KEY }}

      - name: Add VM to known_hosts
        run: echo "${{ secrets.AWS_VM_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      - name: Copy Docker images to VM
        run: |
          scp -r ${{ github.workspace }}/docker-images ubuntu@${{ secrets.AWS_VM_IP }}:/home/ubuntu/webDeployment/

      - name: Deploy on VM
        run: |
          ssh ubuntu@${{ secrets.AWS_VM_IP }} "
            cd /home/ubuntu/webDeployment &&
            for img in docker-images/*.tar; do docker load -i \$img; done &&
            docker-compose up -d --build
          "